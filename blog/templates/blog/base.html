{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Tech Blog{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body>

<nav class="site-nav">
  <a class="nav-brand" href="{% url 'post_list' %}">My Tech Blog</a>

  <ul class="nav-links">
    <li><a href="{% url 'about' %}">About</a></li>
    <li><a href="https://www.github.com" target="_blank" rel="noopener">GitHub</a></li>
    <li><a href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a></li>
  </ul>

  <ul class="nav-right">
    {% if user.is_authenticated %}
      <li><a href="{% url 'post_new' %}" class="btn-nav">+ New Post</a></li>
      <li><a href="{% url 'post_draft_list' %}">Drafts</a></li>
      <li class="nav-greeting">{{ user.username }}</li>
      <li><a href="{% url 'logout' %}">Log out</a></li>
    {% else %}
      <li><a href="{% url 'login' %}">Log in</a></li>
    {% endif %}
  </ul>
</nav>

{% block content %}{% endblock %}

</body>
</html>
