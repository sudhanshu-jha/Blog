{% extends 'blog/base.html' %}

{% block title %}{% if form.instance.pk %}Edit Post{% else %}New Post{% endif %} — My Tech Blog{% endblock %}

{% block content %}
<div class="page-wrap">
  <div class="form-card">
    <h1>{% if form.instance.pk %}Edit Post{% else %}New Post{% endif %}</h1>

    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <div style="display:flex;gap:.75rem;margin-top:1.25rem;">
        <button type="submit" class="btn btn-primary">Save Post</button>
        <a href="{% url 'post_list' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="//cdn.jsdelivr.net/medium-editor/latest/js/medium-editor.min.js"></script>
<link rel="stylesheet" href="//cdn.jsdelivr.net/medium-editor/latest/css/medium-editor.min.css">
<script>var editor = new MediumEditor('.editable');</script>
{% endblock %}
