{% extends 'blog/base.html' %}

{% block title %}Log in — My Tech Blog{% endblock %}

{% block content %}
<div class="login-wrap">
  <div class="login-box">
    <div class="site-wordmark">My Tech Blog</div>

    <div class="form-card">
      <h1>Log in</h1>

      {% if form.errors %}
        <div class="form-error">Username or password didn't match. Try again.</div>
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.75rem;">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
